# Configuracao de deploy no Fly.io.
# App "sempre ligado": min_machines_running = 1 e auto_stop_machines = off.
# Segredos (GEMINI_API_KEY, APP_PASSWORD, SECRET_KEY, ...) NAO ficam aqui —
# vao via `fly secrets set`. Aqui so config nao-sensivel.

app = "transcritor-audio"
primary_region = "gru"  # Sao Paulo

[build]

[env]
  GEMINI_MODEL = "gemini-2.5-flash"
  MAX_UPLOAD_MB = "100"
  COOKIE_SECURE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
