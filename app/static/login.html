<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcritor — Entrar</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --fg:#e7e9ee; --mut:#9aa1ad; --acc:#4f8cff; --line:#2a2f3a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--fg); min-height:100vh;
           display:flex; align-items:center; justify-content:center; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:28px; width:100%; max-width:340px; }
    h1 { font-size:1.3rem; margin:0 0 4px; }
    p.sub { color:var(--mut); margin:0 0 22px; font-size:.9rem; }
    label { display:block; font-size:.85rem; color:var(--mut); margin:14px 0 6px; }
    input { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line);
            border-radius:8px; padding:10px 12px; font:inherit; }
    input:focus { outline:none; border-color:var(--acc); }
    button { width:100%; margin-top:22px; background:var(--acc); color:#fff; border:none;
             border-radius:8px; padding:11px; font:inherit; cursor:pointer; }
    .err { color:#ff6b6b; font-size:.88rem; margin-top:14px; min-height:1em; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1>Transcritor</h1>
    <p class="sub">Entre para transcrever áudios.</p>

    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" autofocus required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>

    <button type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>

  <script>
    if (new URLSearchParams(location.search).has("erro")) {
      document.getElementById("err").textContent = "Usuário ou senha incorretos.";
    }
  </script>
</body>
</html>
