<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcritor</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --fg:#e7e9ee; --mut:#9aa1ad; --acc:#4f8cff; --line:#2a2f3a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--fg); min-height:100vh; }
    .wrap { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
    h1 { font-size:1.5rem; margin:0 0 4px; }
    p.sub { color:var(--mut); margin:0 0 24px; font-size:.92rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
    .drop { border:2px dashed var(--line); border-radius:10px; padding:28px; text-align:center;
            cursor:pointer; transition:border-color .15s, background .15s; }
    .drop:hover, .drop.over { border-color:var(--acc); background:rgba(79,140,255,.06); }
    .drop input { display:none; }
    .fname { color:var(--mut); font-size:.9rem; margin-top:10px; word-break:break-all; }
    .row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    button { font:inherit; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; }
    .primary { background:var(--acc); color:#fff; }
    .primary:disabled { opacity:.5; cursor:not-allowed; }
    .ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
    .ghost:disabled { opacity:.4; cursor:not-allowed; }
    textarea { width:100%; min-height:280px; margin-top:20px; background:var(--bg); color:var(--fg);
               border:1px solid var(--line); border-radius:10px; padding:14px; font:inherit;
               line-height:1.5; resize:vertical; }
    .status { margin-top:14px; font-size:.9rem; min-height:1.2em; }
    .status.err { color:#ff6b6b; }
    .status.ok { color:#5fd38a; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--mut);
            border-top-color:var(--acc); border-radius:50%; animation:r .7s linear infinite;
            vertical-align:-2px; margin-right:6px; }
    @keyframes r { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <h1>Transcritor</h1>
      <a href="/logout" style="color:#9aa1ad;font-size:.85rem;text-decoration:none;">Sair</a>
    </div>
    <p class="sub">Envie um ou mais arquivos de áudio e receba a transcrição em português.</p>

    <div class="card">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac,.aiff" multiple>
        <div><strong>Clique ou arraste</strong> um ou mais arquivos de áudio aqui</div>
        <div class="fname" id="fname">Nenhum arquivo selecionado</div>
      </label>

      <div class="row">
        <button class="primary" id="go" disabled>Transcrever</button>
        <button class="ghost" id="copy" disabled>Copiar</button>
        <button class="ghost" id="dl" disabled>Baixar .txt</button>
      </div>

      <div class="status" id="status"></div>
      <textarea id="out" placeholder="A transcrição aparece aqui (editável)."></textarea>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const file = $("file"), drop = $("drop"), fname = $("fname");
    const go = $("go"), copy = $("copy"), dl = $("dl");
    const out = $("out"), status = $("status");

    function setStatus(msg, cls = "") { status.className = "status " + cls; status.innerHTML = msg; }
    function refreshActions() {
      const has = out.value.trim().length > 0;
      copy.disabled = !has; dl.disabled = !has;
    }

    function descreverSelecao(fs) {
      if (!fs.length) return "Nenhum arquivo selecionado";
      if (fs.length === 1) return fs[0].name;
      return fs.length + " arquivos: " + Array.from(fs).map(f => f.name).join(", ");
    }

    file.addEventListener("change", () => {
      const fs = file.files;
      fname.textContent = descreverSelecao(fs);
      go.disabled = !fs.length;
      // Novo(s) áudio(s) inserido(s): limpa a transcrição anterior.
      out.value = "";
      refreshActions();
      setStatus("");
    });

    ["dragover", "dragenter"].forEach(e =>
      drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(e =>
      drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", ev => {
      if (ev.dataTransfer.files.length) { file.files = ev.dataTransfer.files; file.dispatchEvent(new Event("change")); }
    });

    async function transcreverUm(f) {
      const fd = new FormData();
      fd.append("arquivo", f);
      const r = await fetch("/transcrever", { method: "POST", body: fd });
      // A resposta pode não ser JSON (ex.: erro 500 cru "Internal Server Error").
      // Lê como texto e tenta parsear; se não der, usa o texto na mensagem.
      const raw = await r.text();
      let data = null;
      try { data = JSON.parse(raw); } catch { /* não é JSON */ }
      if (!r.ok) {
        throw new Error((data && data.detail) || raw.trim() || `Falha na transcrição (HTTP ${r.status}).`);
      }
      return data ? data.texto : raw;
    }

    go.addEventListener("click", async () => {
      const fs = Array.from(file.files);
      if (!fs.length) return;
      go.disabled = true;
      copy.disabled = dl.disabled = true;
      out.value = "";

      const blocos = [];
      let erros = 0;
      for (let i = 0; i < fs.length; i++) {
        const f = fs[i];
        const total = fs.length > 1 ? ` (${i + 1}/${fs.length})` : "";
        setStatus(`<span class="spin"></span>Transcrevendo ${f.name}${total}… (pode levar um tempo em áudios longos)`);
        try {
          const texto = await transcreverUm(f);
          blocos.push(`=== ${f.name} ===\n${texto}`);
        } catch (err) {
          erros++;
          blocos.push(`=== ${f.name} ===\n[ERRO: ${err.message}]`);
        }
        // Atualiza o textarea a cada arquivo concluído, pra acompanhar o progresso.
        out.value = blocos.join("\n\n");
        refreshActions();
      }

      if (fs.length === 1) {
        setStatus(erros ? "Falha na transcrição." : "Transcrição concluída.", erros ? "err" : "ok");
      } else {
        const ok = fs.length - erros;
        setStatus(
          erros
            ? `Concluído: ${ok} de ${fs.length} transcritos, ${erros} com erro.`
            : `Concluído: ${fs.length} arquivos transcritos.`,
          erros ? "err" : "ok"
        );
      }
      go.disabled = false;
      refreshActions();
    });

    out.addEventListener("input", refreshActions);

    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(out.value);
      setStatus("Copiado.", "ok");
    });

    dl.addEventListener("click", () => {
      const blob = new Blob([out.value], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      const base = file.files.length === 1
        ? (file.files[0].name || "transcricao").replace(/\.[^.]+$/, "")
        : "transcricao";
      a.download = base + ".txt";
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
