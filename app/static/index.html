<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcritor — Corrêa Info</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/favicon-180.png">
  <style>
    :root {
      --bg:#eaf0ef; --surface:#ffffff; --fg:#10211F; --mut:#5b6b6b;
      --teal:#0F6E78; --coral:#FF6F59; --line:#e6ebea;
      --drop-line:#cfe0e0; --drop-bg:#f7fbfb;
      --ok:#1f7a4d; --err:#c0392b;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
           font-family:Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
           display:flex; justify-content:center; align-items:flex-start; padding:32px 16px 64px; }
    .card { width:100%; max-width:560px; background:var(--surface); border:1px solid var(--line);
            border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(16,33,31,.08); }

    .bar { background:var(--teal); padding:13px 20px; display:flex; align-items:center; gap:10px; }
    .bar .badge { width:30px; height:30px; border-radius:8px; background:#fff;
                  display:flex; align-items:center; justify-content:center; }
    .bar .badge svg { width:20px; height:20px; }
    .bar .wm { color:#fff; font-weight:600; font-size:15px; letter-spacing:.2px; }
    .bar .sair { margin-left:auto; color:rgba(255,255,255,.82); font-size:12.5px; text-decoration:none; }
    .bar .sair:hover { color:#fff; }

    .body { padding:24px 22px 26px; }
    h1 { font-size:1.15rem; font-weight:600; margin:0 0 3px; }
    p.sub { color:var(--mut); margin:0 0 18px; font-size:.84rem; }

    .drop { display:block; border:2px dashed var(--drop-line); background:var(--drop-bg); border-radius:16px;
            padding:30px 16px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
    .drop:hover, .drop.over { border-color:var(--teal); background:#eef6f6; }
    .drop input { display:none; }
    .drop .ic { width:50px; height:50px; border-radius:13px; background:#eaf3f3;
                display:inline-flex; align-items:center; justify-content:center; margin-bottom:10px; }
    .drop .ic svg { width:24px; height:24px; }
    .drop .big { color:var(--fg); font-weight:600; font-size:14px; }
    .drop .small { color:#7b8988; font-size:12px; margin-top:3px; }

    .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
    .chips:empty { display:none; }
    .chip { background:#eef4f3; border:1px solid #d9e4e3; color:#27403f; font-size:11px;
            padding:4px 10px; border-radius:999px; word-break:break-all; }

    .row { display:flex; gap:9px; margin-top:18px; flex-wrap:wrap; }
    button { font:inherit; font-size:.84rem; font-weight:600; border:none; border-radius:10px;
             padding:10px 17px; cursor:pointer; }
    .primary { background:var(--coral); color:#fff; }
    .primary:disabled { opacity:.5; cursor:not-allowed; }
    .ghost { background:#fff; color:var(--fg); border:1px solid #d6dedd; }
    .ghost:disabled { opacity:.45; cursor:not-allowed; }

    .status { margin-top:14px; font-size:.82rem; min-height:1.2em; color:var(--teal);
              display:flex; align-items:center; gap:7px; }
    .status.err { color:var(--err); }
    .status.ok { color:var(--ok); }
    .spin { width:13px; height:13px; border:2px solid var(--drop-line); border-top-color:var(--teal);
            border-radius:50%; display:inline-block; animation:r .7s linear infinite; }
    @keyframes r { to { transform:rotate(360deg); } }

    textarea { width:100%; min-height:240px; margin-top:10px; background:#fbfdfd; color:var(--fg);
               border:1px solid var(--line); border-radius:12px; padding:14px; font:inherit;
               font-size:.9rem; line-height:1.55; resize:vertical; }
    textarea:focus { outline:none; border-color:var(--teal); }
    .tabs { display:flex; gap:6px; margin-bottom:18px; }
    .tab { flex:1; text-align:center; font-size:.85rem; font-weight:600;
           padding:9px 12px; border-radius:10px; border:1px solid #d6dedd;
           background:#fff; color:var(--mut); cursor:pointer; }
    .tab.ativa { background:var(--teal); color:#fff; border-color:var(--teal); }
    .modo { display:none; }
    .modo.ativo { display:block; }
    .fontes { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .fonte-op { flex:1; min-width:90px; text-align:center; font-size:.8rem;
                padding:9px; border-radius:10px; border:1px solid #d6dedd;
                background:#fff; color:var(--fg); cursor:pointer; }
    .fonte-op.sel { border-color:var(--teal); background:#eef6f6; color:var(--teal); font-weight:600; }
    .ao-vivo-rec { display:inline-block; width:9px; height:9px; border-radius:50%;
                   background:var(--coral); margin-right:6px; vertical-align:1px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bar">
      <span class="badge">
        <svg viewBox="0 0 256 256" role="img" aria-label="Corrêa Info">
          <path d="M162 89.4 A60 60 0 1 0 162 166.6" fill="none" stroke="#0F6E78" stroke-width="24" stroke-linecap="round"/>
          <circle cx="171" cy="128" r="16" fill="#FF6F59"/>
        </svg>
      </span>
      <span class="wm">Corrêa Info</span>
      <a class="sair" href="/logout">Sair</a>
    </div>

    <div class="body">
      <h1>Transcritor de áudio</h1>
      <p class="sub">Olá! Envie um ou mais áudios e receba o texto em português.</p>

      <div class="tabs">
        <button class="tab ativa" id="tab-arquivo" type="button">Arquivo</button>
        <button class="tab" id="tab-aovivo" type="button">Ao vivo</button>
      </div>

      <!-- MODO ARQUIVO (fluxo existente) -->
      <div class="modo ativo" id="modo-arquivo">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac,.aiff" multiple>
          <div class="ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0F6E78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>
            </svg>
          </div>
          <div class="big">Arraste um ou vários áudios</div>
          <div class="small">ou clique para escolher</div>
          <div class="chips" id="fname"></div>
        </label>
        <div class="row">
          <button class="primary" id="go" disabled>Transcrever</button>
        </div>
      </div>

      <!-- MODO AO VIVO -->
      <div class="modo" id="modo-aovivo">
        <div class="fontes">
          <button class="fonte-op sel" data-fonte="ambos" type="button">Mic + PC</button>
          <button class="fonte-op" data-fonte="mic" type="button">Microfone</button>
          <button class="fonte-op" data-fonte="pc" type="button">Áudio do PC</button>
        </div>
        <div class="row">
          <button class="primary" id="iniciar" type="button">Iniciar</button>
          <button class="ghost" id="parar" type="button" disabled>Parar</button>
        </div>
      </div>

      <!-- Compartilhado pelos dois modos -->
      <div class="row" style="margin-top:12px;">
        <button class="ghost" id="copy" disabled>Copiar</button>
        <button class="ghost" id="dl" disabled>Baixar .txt</button>
      </div>

      <div class="status" id="status"></div>
      <textarea id="out" placeholder="A transcrição aparece aqui (editável)."></textarea>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const file = $("file"), drop = $("drop"), fname = $("fname");
    const go = $("go"), copy = $("copy"), dl = $("dl");
    const out = $("out"), status = $("status");

    function setStatus(msg, cls = "") { status.className = "status " + cls; status.innerHTML = msg; }
    function refreshActions() {
      const has = out.value.trim().length > 0;
      copy.disabled = !has; dl.disabled = !has;
    }

    // Renderiza os arquivos selecionados como chips (textContent evita injeção via nome).
    function renderChips(fs) {
      fname.innerHTML = "";
      for (const f of fs) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = f.name;
        fname.appendChild(chip);
      }
    }

    file.addEventListener("change", () => {
      const fs = file.files;
      renderChips(fs);
      go.disabled = !fs.length;
      // Novo(s) áudio(s) inserido(s): limpa a transcrição anterior.
      out.value = "";
      refreshActions();
      setStatus("");
    });

    ["dragover", "dragenter"].forEach(e =>
      drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(e =>
      drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", ev => {
      if (ev.dataTransfer.files.length) { file.files = ev.dataTransfer.files; file.dispatchEvent(new Event("change")); }
    });

    async function transcreverUm(f) {
      const fd = new FormData();
      fd.append("arquivo", f);
      const r = await fetch("/transcrever", { method: "POST", body: fd });
      // A resposta pode não ser JSON (ex.: erro 500 cru "Internal Server Error").
      // Lê como texto e tenta parsear; se não der, usa o texto na mensagem.
      const raw = await r.text();
      let data = null;
      try { data = JSON.parse(raw); } catch { /* não é JSON */ }
      if (!r.ok) {
        throw new Error((data && data.detail) || raw.trim() || `Falha na transcrição (HTTP ${r.status}).`);
      }
      return data ? data.texto : raw;
    }

    go.addEventListener("click", async () => {
      const fs = Array.from(file.files);
      if (!fs.length) return;
      go.disabled = true;
      copy.disabled = dl.disabled = true;
      out.value = "";

      const blocos = [];
      let erros = 0;
      for (let i = 0; i < fs.length; i++) {
        const f = fs[i];
        const total = fs.length > 1 ? ` (${i + 1}/${fs.length})` : "";
        setStatus(`<span class="spin"></span> Transcrevendo ${f.name}${total}… (pode levar um tempo em áudios longos)`);
        try {
          const texto = await transcreverUm(f);
          blocos.push(`=== ${f.name} ===\n${texto}`);
        } catch (err) {
          erros++;
          blocos.push(`=== ${f.name} ===\n[ERRO: ${err.message}]`);
        }
        // Atualiza o textarea a cada arquivo concluído, pra acompanhar o progresso.
        out.value = blocos.join("\n\n");
        refreshActions();
      }

      if (fs.length === 1) {
        setStatus(erros ? "Falha na transcrição." : "Transcrição concluída.", erros ? "err" : "ok");
      } else {
        const ok = fs.length - erros;
        setStatus(
          erros
            ? `Concluído: ${ok} de ${fs.length} transcritos, ${erros} com erro.`
            : `Concluído: ${fs.length} arquivos transcritos.`,
          erros ? "err" : "ok"
        );
      }
      go.disabled = false;
      refreshActions();
    });

    out.addEventListener("input", refreshActions);

    // ----- Abas -----
    const tabArquivo = $("tab-arquivo"), tabAovivo = $("tab-aovivo");
    const modoArquivo = $("modo-arquivo"), modoAovivo = $("modo-aovivo");
    function trocarAba(aovivo) {
      tabAovivo.classList.toggle("ativa", aovivo);
      tabArquivo.classList.toggle("ativa", !aovivo);
      modoAovivo.classList.toggle("ativo", aovivo);
      modoArquivo.classList.toggle("ativo", !aovivo);
    }
    tabArquivo.addEventListener("click", () => trocarAba(false));
    tabAovivo.addEventListener("click", () => trocarAba(true));

    // ----- Seletor de fonte -----
    let fonteSel = "ambos";
    document.querySelectorAll(".fonte-op").forEach(op => {
      op.addEventListener("click", () => {
        document.querySelectorAll(".fonte-op").forEach(o => o.classList.remove("sel"));
        op.classList.add("sel");
        fonteSel = op.dataset.fonte;
      });
    });

    // ----- WebSocket ao vivo -----
    const iniciar = $("iniciar"), parar = $("parar");
    let ws = null;
    iniciar.addEventListener("click", () => {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/ao-vivo`);
      iniciar.disabled = true;
      out.value = "";
      refreshActions();
      ws.onopen = () => ws.send(JSON.stringify({ acao: "iniciar", fonte: fonteSel }));
      ws.onmessage = (ev) => {
        const m = JSON.parse(ev.data);
        if (m.tipo === "texto") { out.value += m.texto; refreshActions(); }
        else if (m.tipo === "status") {
          if (m.status === "capturando") {
            setStatus('<span class="ao-vivo-rec"></span> Capturando ao vivo…');
            parar.disabled = false;
          } else if (m.status === "reconectando") {
            setStatus('<span class="spin"></span> Reconectando…');
          } else if (m.status === "parado") {
            setStatus("Captura encerrada.", "ok");
          }
        } else if (m.tipo === "erro") {
          setStatus(m.msg, "err");
          iniciar.disabled = false; parar.disabled = true;
        }
      };
      ws.onclose = () => { iniciar.disabled = false; parar.disabled = true; };
      ws.onerror = () => setStatus("Falha na conexão ao vivo.", "err");
    });
    parar.addEventListener("click", () => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ acao: "parar" }));
      parar.disabled = true;
      iniciar.disabled = false;
    });

    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(out.value);
      setStatus("Copiado.", "ok");
    });

    dl.addEventListener("click", () => {
      const blob = new Blob([out.value], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      const base = file.files.length === 1
        ? (file.files[0].name || "transcricao").replace(/\.[^.]+$/, "")
        : "transcricao";
      a.download = base + ".txt";
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
